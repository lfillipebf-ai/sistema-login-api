services:
  postgres:
    image: postgres:16
    container_name: login-postgres
    environment:
      POSTGRES_DB: login
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $postgres -d $login"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - login_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: login-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/login
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: uma-chave-secreta-para-desenvolvimento-com-pelo-menos-32-caracteres
    ports:
      - "8080:8080"

volumes:
  login_data:
